[project]
name = "rfam-seed-qc"
# Keep in sync with VERSION and CITATION.cff (checked by CI)
version = "1.3.2"
description = "Tools for ensuring the quality of multiple sequence alignments (MSAs) in Rfam."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "biopython>=1.79",
]

[tool.uv]
# Not an installable package: run the scripts from a clone with `uv run`.
# Non-Python tools (Infernal: cmscan, cmpress; Easel: esl-reformat; BLAST+
# for --local) are not managed by uv; see environment.yml or the README.
package = false

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: needs internet access to NCBI (run with -m 'not network' to skip)",
]
