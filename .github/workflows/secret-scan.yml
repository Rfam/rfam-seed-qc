name: Secret scan

# Scan every push and pull request for credentials (API keys, tokens,
# private keys) with TruffleHog. Complements GitHub's own secret scanning and
# push protection (enabled in the repository settings): this check is visible
# on every PR and also covers generic patterns.
on:
  push:
  pull_request:
  workflow_dispatch:   # run by hand to scan the whole history

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0               # full history, so the commits being pushed can be scanned
          persist-credentials: false

      # On push and pull_request the action scans only the new commits; on a
      # manual run, the whole history. --results=verified,unknown reports keys
      # confirmed live and keys that could not be checked, not known-invalid ones.
      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@d232362a64a09a9e7d58267b8f5acef00ae90e23 # v3.100.0
        with:
          extra_args: --results=verified,unknown
