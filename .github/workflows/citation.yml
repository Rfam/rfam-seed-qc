name: Check citation and version metadata

on:
  push:
    paths:
      - 'CITATION.cff'
      - 'VERSION'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/citation.yml'
  pull_request:
    paths:
      - 'CITATION.cff'
      - 'VERSION'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/citation.yml'

jobs:
  check-metadata:
    name: Validate CITATION.cff, versions and uv.lock
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate CITATION.cff schema
        run: |
          pip install cffconvert==2.0.0
          cffconvert --validate

      - name: Check VERSION, CITATION.cff and pyproject.toml versions match
        run: |
          file_version=$(tr -d '[:space:]' < VERSION)
          cff_version=$(sed -n 's/^version:[[:space:]]*["'\'']\{0,1\}\([^"'\'']*\)["'\'']\{0,1\}[[:space:]]*$/\1/p' CITATION.cff)
          py_version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "VERSION:        $file_version"
          echo "CITATION.cff:   $cff_version"
          echo "pyproject.toml: $py_version"
          status=0
          if [ "$file_version" != "$cff_version" ]; then
            echo "::error file=CITATION.cff::version ($cff_version) does not match VERSION ($file_version). Update version and date-released in CITATION.cff."
            status=1
          fi
          if [ "$file_version" != "$py_version" ]; then
            echo "::error file=pyproject.toml::version ($py_version) does not match VERSION ($file_version). Update version in pyproject.toml and run 'uv lock'."
            status=1
          fi
          exit $status

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Check uv.lock is up to date with pyproject.toml
        run: uv lock --check
