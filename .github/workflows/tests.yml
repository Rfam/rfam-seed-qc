name: Tests

on:
  push:
    paths-ignore:
      - 'alignments/**'
  pull_request:
    paths-ignore:
      - 'alignments/**'

permissions:
  contents: read

jobs:
  test:
    name: Validator tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The oldest supported Python (requires-python in pyproject.toml) and the
    # newest. The network test contacts NCBI, so it runs only once (3.12).
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.10'
            pytest-args: "-m 'not network'"
          - python-version: '3.12'
            pytest-args: ''
          - python-version: '3.13'
            pytest-args: "-m 'not network'"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # read-only job: do not keep the token on disk

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ matrix.python-version }}

      # Fixture tests run offline. The --fix test (marked "network") looks up
      # two sequences at NCBI.
      - name: Run tests
        run: uv run pytest -v ${{ matrix.pytest-args }}
